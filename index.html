<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Trader AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dark trading terminal. Live tape on top, summary tiles, then one card per stock with a price ladder. */
:root{
  --bg:#060a13; --bg2:#0b1222; --card:#0f1830; --card2:#15213d; --line:#243458; --ink:#eaf0ff; --soft:#9fb0d0;
  --accent:#22d3ee; --accent2:#a78bfa; --accent-ink:#031018;
  --good:#34d399; --bad:#fb7185; --warn:#fbbf24; --blue:#60a5fa; --pink:#f472b6;
  --good-bg:rgba(52,211,153,.13); --bad-bg:rgba(251,113,133,.13); --warn-bg:rgba(251,191,36,.12); --blue-bg:rgba(96,165,250,.13);
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 500px at 85% -10%,rgba(167,139,250,.18),transparent 60%),radial-gradient(900px 420px at -10% 0%,rgba(34,211,238,.14),transparent 55%),var(--bg);
  color:var(--ink);font:16px/1.5 var(--body);min-height:100%}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
@media (min-width:1000px){.wrap{max-width:1200px}}
html{background:var(--bg)}body{min-height:100vh}
header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
h1{font:600 26px/1.15 var(--display);margin:0;letter-spacing:.3px;background:linear-gradient(90deg,var(--accent),var(--accent2) 60%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font:600 19px/1.25 var(--display);margin:0 0 10px;text-wrap:balance;letter-spacing:.2px}
h3{font:600 15px/1.3 var(--body);margin:0 0 6px}
#sync{font-size:13px;color:var(--soft);margin-left:auto}
#deskTools button{min-height:40px;padding:6px 12px;font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:8px;border-bottom:1px solid var(--line)}
nav a{flex:none;padding:10px 14px;border-radius:999px;text-decoration:none;color:var(--soft);font-weight:600;border:1px solid var(--line);min-height:44px;display:flex;align-items:center;background:var(--bg2)}
nav a[aria-current="page"]{color:var(--accent-ink);background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent}
.tape{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin-bottom:6px}
.chip{flex:none;display:flex;flex-direction:column;gap:1px;padding:7px 11px;border-radius:10px;background:var(--card);border:1px solid var(--line);min-width:110px}
.chip b{font:600 13px var(--body);letter-spacing:.3px}
.chip .num{font-size:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:12px;padding:10px 12px}
.tile.g{border-top-color:var(--good)}.tile.r{border-top-color:var(--bad)}.tile.v{border-top-color:var(--accent2)}.tile.y{border-top-color:var(--warn)}
.tile .k{font-size:12.5px;color:var(--soft);text-transform:uppercase;letter-spacing:.5px}
.tile .v{font:500 19px/1.3 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font:600 26px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.chiplink{color:inherit;text-decoration:none;cursor:pointer}.chiplink:hover,.chiplink:focus-visible{border-color:var(--blue);outline:none;box-shadow:0 0 0 2px var(--blue)}
.foldbtn{flex:none;min-width:34px;min-height:34px;padding:0 8px;margin-right:6px;font-size:16px;line-height:1;border-radius:8px}
.foldbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.sortbtn{all:unset;cursor:pointer;font:inherit;font-weight:600;white-space:nowrap}.sortbtn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
td input[type=checkbox]{width:20px;height:20px;min-height:0;margin:0}
fieldset input[type=checkbox]{width:20px;height:20px;min-height:0;margin:0;flex:none}#absCk label,#absRpF label{flex:1 1 170px}#absRpF fieldset label{flex:none}#fnoF label{flex:1 1 150px}#fnoF label.row{flex-direction:row!important;justify-content:flex-start;text-align:left;align-items:center}#fnoF input[type=checkbox]{width:20px;height:20px;min-height:0;margin:0;flex:none}#fnoF fieldset.fnoInd>label.row{flex:0 0 100%}
#goldRpF input[type=checkbox]{width:20px;height:20px;min-height:0;margin:0;flex:none}#goldRpF label{flex:1 1 150px}#goldRpF fieldset label{flex:none}
.chartbar{display:flex;gap:6px;align-items:center;margin:0 0 4px}.chartbar .rangesel{flex:1;margin:0}.fsbtn{flex:none;min-width:38px;min-height:34px;padding:0 8px;font-size:17px;line-height:1}
#fsDlg{width:100vw;max-width:100vw;height:100vh;max-height:100vh;margin:0;padding:14px 18px;border:0;background:var(--bg,#0b1220);color:inherit}#fsDlg::backdrop{background:rgba(0,0,0,.7)}#fsDlg .fsh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}#fsDlg .chart svg{max-height:calc(100vh - 190px)}
.rangesel{width:100%;margin:0 0 4px;font-size:14px;padding:6px 8px}.pats{margin:4px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.45}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:8px 0 4px}.chart{margin:0}.chart svg{width:100%;height:auto;display:block;background:rgba(255,255,255,.02);border-radius:8px}.chart figcaption{font-size:13px;color:var(--soft);margin-top:2px}
.pos{color:var(--good)}.neg{color:var(--bad)}.soft{color:var(--soft)}.amb{color:var(--warn)}
.note{border-left:4px solid var(--warn);background:var(--warn-bg);padding:10px 12px;border-radius:8px;margin:0}
.note.bad{border-color:var(--bad);background:var(--bad-bg)}
.note.good{border-color:var(--good);background:var(--good-bg)}
.note.info{border-color:var(--blue);background:var(--blue-bg)}
.pill{display:inline-block;font:600 12.5px/1 var(--body);padding:5px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.open{color:var(--blue);background:var(--blue-bg)}.pill.hit{color:var(--good);background:var(--good-bg)}.pill.sub{color:var(--warn);background:var(--warn-bg)}.pill.closed{color:var(--bad);background:var(--bad-bg)}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:52px;padding:6px 8px;border-radius:10px;font:600 16px var(--mono);color:var(--accent-ink)}
.lot{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:6px}
.lot .head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.lot dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:4px 12px;margin:0}
.lot dt{font-size:12.5px;color:var(--soft)}.lot dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--soft);flex:1 1 130px}
input,select,textarea{font:16px var(--body);color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;width:100%}
textarea{font:13px var(--mono);min-height:110px}
button{font:600 15px var(--body);min-height:44px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer}
button.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent}
button.danger{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
ul.plain{margin:0;padding-left:18px}
details summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:32px}
.checks{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.checks label{flex-direction:row;align-items:flex-start;gap:10px;color:var(--ink);font-size:15px;flex:none}
.checks input{width:22px;min-height:22px;height:22px;flex:none;margin-top:2px}
.scroll{overflow:auto;max-height:min(75vh,900px);overscroll-behavior:contain}
.scroll thead th{position:sticky;top:0;z-index:2;background:var(--card);box-shadow:0 1px 0 rgba(255,255,255,.12)}
.scroll:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--soft);font-weight:600}td.r,th.r{text-align:right}
td.r{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eg{border-style:dashed}
/* price ladder */
.bar{position:relative;height:16px;margin:14px 6px 6px;border-radius:8px;background:linear-gradient(90deg,rgba(251,113,133,.35),rgba(251,191,36,.3) 45%,rgba(52,211,153,.35))}
.bar i{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--bg)}
.bar i.b{background:var(--blue)}.bar i.t{background:var(--good)}.bar i.e{background:var(--warn);border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
.bar i.n{width:4px;height:28px;border-radius:2px;background:#fff;border:0;box-shadow:0 0 10px rgba(255,255,255,.8)}
.ladder{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.ladder li{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:8px;background:var(--bg2);border-left:4px solid var(--line);font-size:14px}
.ladder li.t{border-left-color:var(--good)}.ladder li.b{border-left-color:var(--blue)}.ladder li.e{border-left-color:var(--warn)}
.ladder li.n{border-left-color:#fff;background:rgba(255,255,255,.08);font-weight:600}
.ladder .num{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{padding-bottom:96px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;padding:0;border:0;
  display:flex;align-items:center;justify-content:center;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),var(--accent2) 60%,var(--pink));box-shadow:0 10px 30px rgba(34,211,238,.35);z-index:20}
.chat{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(86px,calc(env(safe-area-inset-bottom) + 86px));width:min(420px,calc(100vw - 24px));height:min(640px,calc(100% - 110px));
  display:flex;flex-direction:column;background:linear-gradient(180deg,var(--card2),var(--bg2));border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.55);z-index:21;overflow:hidden}
.chat[hidden]{display:none}
.chat-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(34,211,238,.06)}
.chat-h button{margin-left:auto;min-height:40px;min-width:40px;padding:6px 10px}
.chat-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:15px;line-height:1.45}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(167,139,250,.22));border:1px solid #3b4f7a;border-bottom-right-radius:4px}
.msg ul{margin:4px 0 0;padding-left:18px}
.chat-chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-top:1px solid var(--line);max-height:130px;overflow-y:auto}
.chat-chips button{min-height:38px;padding:6px 12px;border-radius:999px;font-size:14px;background:var(--bg2);border:1px solid #34496f;color:var(--ink)}
.chat-chips button.go{background:linear-gradient(90deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent}
.chat-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.chat-f input{flex:1}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}.card:hover{border-color:#34496f}}
.filters{padding:12px 14px}.fgroup{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0}
.flabel{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft,#9aa4b2);min-width:78px}
.fchip{border-radius:999px;padding:6px 12px;min-height:36px}.fchip.on{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:700}
.fchip .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.12);font-size:12px;margin-left:2px}
.fchip.on .cnt{background:rgba(0,0,0,.18)}
a.btn{display:inline-flex;align-items:center;padding:8px 14px;border:1px solid var(--line,#334);border-radius:10px;color:inherit;text-decoration:none;min-height:36px}
a.btn:hover,a.btn:focus-visible{border-color:var(--accent)}
.cmp{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 8px;padding:8px 10px;border-radius:10px;background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25)}
.cmpL{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--accent)}
.cmp .num{font-size:18px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 14px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line,#334)}
.levels dt{font-size:12px;color:var(--soft,#9aa4b2)}.levels dd{margin:0;font-variant-numeric:tabular-nums}
.verdict{margin-top:6px;padding:8px 10px;border-radius:10px;border:1px solid currentColor;background:rgba(255,255,255,.04)}
.verdict.soft{color:inherit;border-color:var(--line,#334)}
.faq{padding:0}.faq>summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style-position:inside}
.faq>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:12px}
.faq .faqA{padding:0 16px 14px}.faq .faqA p{margin:8px 0}.faqH{margin:18px 0 8px;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.tvl{font-size:13px;font-weight:600;padding:3px 9px;border:1px solid var(--line,#334);border-radius:999px;color:inherit;text-decoration:none;white-space:nowrap}
.tvl:hover,.tvl:focus-visible{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>Stock Trader AI</h1><span id="sync" role="status" aria-live="polite">Loading your book…</span>
  <span id="deskTools" hidden><button type="button" id="refreshBtn">↻ Refresh prices</button> <button type="button" id="notifBtn" hidden>Turn on Windows alerts</button></span></header>
  <div id="alertBar" role="alert"></div>
  <nav aria-label="Sections" id="nav"></nav>
  <div class="tape" id="tape" aria-label="Your stocks today"></div>
  <main id="main" class="stack" tabindex="-1"></main>
</div>
<button id="fab" class="fab" aria-label="Open Sto-Bot" aria-expanded="false" aria-controls="chat">
  <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm3 6.5a1.5 1.5 0 1 0 0 .01zm5 0a1.5 1.5 0 1 0 0 .01zm5 0a1.5 1.5 0 1 0 0 .01z"/></svg>
</button>
<dialog id="fsDlg" aria-labelledby="fsT"><div class="fsh"><h2 id="fsT" style="margin:0">Chart</h2><button type="button" id="fsX" class="primary">✕ Close full screen</button></div><div id="fsBody"></div><p class="soft" style="font-size:13px;margin:6px 0 0">Press Esc or the Close button to go back.</p></dialog>
<section id="chat" class="chat" role="dialog" aria-label="Sto-Bot" hidden>
  <div class="chat-h"><strong>🤖 Sto-Bot</strong><span class="soft" style="font-size:12.5px">no Claude usage</span><button id="chatX" aria-label="Close Sto-Bot">✕</button></div>
  <div id="log" class="chat-log" role="log" aria-live="polite"></div>
  <div id="chips" class="chat-chips"></div>
  <form id="chatF" class="chat-f"><label for="chatIn" class="sr">Message</label><input id="chatIn" autocomplete="off" placeholder="e.g. bought MRPL 300 at 178.5"><button class="primary" aria-label="Send">Send</button></form>
</section>
<script>
/*CORE-START  (pure logic, no DOM: the same rules as the server build) */
const DEFAULTS={capital:150000,tranche:50000,maxTranches:3,targetPct:3,stepPct:3,reservePct:0,maxPositions:10,maxLots:30,
  maxDrawdownPct:15,riskExitPct:10,brokeragePct:0.3,brokerageCap:20,dpCharge:12.5,slippageBps:5};
const RATES={stt:0.1,exch:0.00297,sebi:0.0001,ipft:0.0001,stamp:0.015,gst:18};
const r2=x=>Math.round((x+Number.EPSILON)*100)/100;
function newBook(){return{v:4,parts:{},steps:{},rev:0,settings:{...DEFAULTS},cash:DEFAULTS.capital,realized:0,charges:0,peak:DEFAULTS.capital,
  nextId:1,lots:[],tx:[],prices:{},blocked:{}};}
function legCharges(side,price,qty,s){
  const value=price*qty; if(value<=0) return{total:0,brokerage:0,stt:0,exch:0,sebi:0,ipft:0,stamp:0,gst:0,dp:0};
  const brokerage=Math.min(value*s.brokeragePct/100,s.brokerageCap), exch=value*RATES.exch/100,
    sebi=value*RATES.sebi/100, ipft=value*RATES.ipft/100, gst=(brokerage+exch+sebi+ipft)*RATES.gst/100,
    stt=value*RATES.stt/100, stamp=side==="BUY"?value*RATES.stamp/100:0, dp=side==="SELL"?s.dpCharge*1.18:0;
  return{brokerage,stt,exch,sebi,ipft,stamp,gst,dp,total:r2(brokerage+stt+exch+sebi+ipft+stamp+gst+dp)};
}
function roundTrip(buy,sell,qty,s){
  const b=legCharges("BUY",buy,qty,s), x=legCharges("SELL",sell,qty,s), slip=r2((buy+sell)*qty*s.slippageBps/10000);
  const gross=r2((sell-buy)*qty), invested=buy*qty, net=r2(gross-b.total-x.total-slip);
  return{qty,invested:r2(invested),gross,buyCharges:b.total,sellCharges:x.total,slippage:slip,costs:r2(b.total+x.total+slip),
    net,grossPct:r2(100*gross/invested),netPct:r2(100*net/invested)};
}
const active=B=>B.lots.filter(l=>l.status!=="CLOSED");
const lotsOf=(B,sym)=>active(B).filter(l=>l.symbol===sym);
const held=B=>[...new Set(active(B).map(l=>l.symbol))].sort();
const reserve=B=>r2(B.settings.capital*B.settings.reservePct/100);
const deployable=B=>r2(Math.max(B.cash-reserve(B),0));
const priceOf=(B,l)=>(B.prices[l.symbol]&&B.prices[l.symbol].p)||l.buyPrice;
const invested=B=>r2(active(B).reduce((a,l)=>a+l.buyPrice*l.qty,0));
const marketValue=B=>r2(active(B).reduce((a,l)=>a+priceOf(B,l)*l.qty,0));
const equity=B=>r2(B.cash+marketValue(B));
const unrealized=B=>r2(active(B).reduce((a,l)=>a+(priceOf(B,l)-l.buyPrice)*l.qty,0));
function drawdownPct(B){const eq=equity(B),peak=Math.max(B.peak,eq);return peak>0?r2(100*(1-eq/peak)):0;}
function nextLotNo(B,sym){const used=lotsOf(B,sym).map(l=>l.lotNo);for(let n=1;n<=3;n++)if(!used.includes(n))return n;return 4;}
/* Gap for this stock's next parts: fixed at its first buy from the scan's suggestion, editable. */
const stepFor=(B,sym)=>(B.steps&&B.steps[sym])||B.settings.stepPct;
/* Reference for the next tranche: the open lot with the LOWEST purchase price. */
function lastLot(B,sym){const ls=lotsOf(B,sym);return ls.length?ls.reduce((a,l)=>l.buyPrice<a.buyPrice?l:a):null;}
/* Your rule: a NEW stock gets (free cash ÷ 3) per part, fixed at its first buy; its later lots use the same part. */
const newPart=B=>Math.floor(deployable(B)/3);
const partFor=(B,sym)=>lotsOf(B,sym).length&&B.parts&&B.parts[sym]?B.parts[sym]:newPart(B);
function sizeTranche(B,price,part){

function giPickSellLots(C,t){

      }else{

        const ls=ids.map(id=>C.lots.find(l=>l.id===id));r.act="sell";r.ok=true;r.lots=ls.map(l=>l.lotNo);
        const pl=ls.reduce((a,l)=>a+(t.price-l.buyPrice)*l.qty,0);

  ${q("The price was inside the range but it said “Close to buy zone”. Is that a mistake?",`<p>No. The range is only check 6. Other checks can still fail. On 13 Nov ANGELONE was inside its range, but its RSI was 73 (overheated, often dips for a few days) and there was a recent high just below its +${t}% target. Two checks failed, so it showed amber with "Waiting for: RSI to cool below 68; room below the next resistance level". Buying inside the range is your call; the checks only tell you how clean the setup is.</p>`)}
  ${q("What does “CMP is inside the buy zone” on the card mean?",`<p>It compares the live price (CMP, updated every 15 minutes in market hours) with the entry price range only. The status tag at the top right is still based on the full checklist from the last evening scan. Green on both = price in range <em>and</em> setup clean.</p>`)}
  <h3 class="faqH">Score and list</h3>
  ${q("How is the score out of 100 worked out?",`<ul class="plain"><li><strong>Company strength 25:</strong> return on equity, growth, debt, margins, cash flow, pledging</li><li><strong>Technical 25:</strong> trend, moving averages, chart pattern</li><li><strong>Momentum 20:</strong> its 3- and 6-month rise ranked against all Nifty 500 stocks, and how much it beat the Nifty over 3 months</li><li><strong>Liquidity 15:</strong> trading volume</li><li><strong>Risk and market 15:</strong> the Nifty's trend, how jumpy the stock is, distance from its 52-week high, buying/selling pressure</li></ul>
   <p>When company data is missing, the other 75 points are scaled up to 100 and the card says so. The list shows stocks scoring ${m}+.</p>`)}
  ${q("Why is a high-scoring stock left out of the top list?",`<p>Only large, steady companies are allowed, so a stock is less likely to keep falling: market value over ₹15,000 crore, return on equity 10%+, debt below equity, positive free cash flow, profit not down more than 25%, and about 3 years of trading history. A stock that misses any of these is left out, and the reason is shown at the end of the Top 20 tab or under "Why it is not listed" in Analyze other stocks.</p>`)}
  ${q("What is the +3% history figure (e.g. touched +3% within 5 sessions 46% of the time)?",`<p>The tool looks back over about 3 years for days when the stock was in a similar state to today, and counts how often it then reached +${t}% within the next 5 trading days, and how often it first fell ${t}%. It is a past frequency, not a promise.</p>`)}
  ${q("When does a stock move to “Became invalid”?",`<p>Stocks stay on your list day after day until one of these happens: the trend turns down, it fails a company red-flag check, or it drops out of the scan because it no longer qualifies. Then it moves to the Became invalid tab with the reason.</p>`)}
  <h3 class="faqH">Your rules</h3>
  ${q("How big is each part, and when do I buy parts 2 and 3?",`<p>When you start a new stock, one part = free cash ÷ 3 at that moment, and that part size stays fixed for that stock. Part 2 is bought when the price is a set gap below your lowest open lot, part 3 another gap below part 2.</p>
   <p>The gap is chosen per stock from its own past: the tool replays your exact rules over about 3 years at gaps of 3% to 10% and picks the one that earned the most per rupee used. Jumpy stocks usually get wider gaps.</p>`)}
  ${q("When do I sell?",`<p>Each lot sells on its own at +${t}% of its own buy price, never at a loss. Money from a sold lot is free for any stock. The Positions tab shows every lot's sell price, and Windows alerts when one is reached.</p>`)}
  <h3 class="faqH">Prices, news and WhatsApp</h3>
  ${q("Where do prices and news come from? Are they live?",`<p>Prices come from Yahoo Finance (unofficial, can be a few minutes late), refreshed every 15 minutes in market hours and after each close. News comes from Yahoo Finance and Google News. The full scan runs every weekday at 6 PM. Always confirm the price at your broker before placing an order: this tool never places orders.</p>`)}
  ${q("How does Sto-Bot decide whether news is good or bad?",`<p>It reads the headlines (not the full articles) and looks for words and phrases that usually move prices: "profit jumps", "bags order", "target raised" read as good; "misses estimates", "SEBI notice", "downgrade", "NPA rises" read as bad. A serious headline (probe, penalty, default) always makes the overall verdict bad. It shows how news usually lands, not what the price will do. It runs on your laptop with no AI service.</p>`)}
  ${q("What are 50 EMA, 200 EMA, ATH and ATL?",`<p><strong>50 / 200 EMA:</strong> the average price over about 50 and 200 trading days, giving more weight to recent days. Price above both usually means an uptrend. <strong>ATH / ATL:</strong> all-time high and low since Yahoo's history starts (usually around 2000 or listing), adjusted for splits.</p>`)}
  ${q("How does the WhatsApp message work?",`<p>Nothing is sent by any outside service. At 8:30 AM a Windows notification appears; click it, or press 📲 Send to my WhatsApp, and WhatsApp Desktop opens with the list typed in. You press Send. For groups, pick them in WhatsApp's Send to list. Each card shows: name, buy-zone status, CMP, entry range and score.</p>`)}
  <p class="soft">This tool gives information, not investment advice. Past behaviour does not guarantee future results.</p>`;
},
analyze(){
  const d=cur(),t=d.target_pct;
  let h=`<section><h2>Analyze any NSE stock</h2><p class="soft" style="margin:0">Same checks as the top list: technical and company score, buy zone, +${t}% level, gap for your next parts, CMP, EMAs, all-time high and low, and news. Stocks you add stay here and are re-checked every evening.</p></section>`;
  if(!LOCAL&&!PHONE) return h+`<p class="note">Analysing a stock needs live data, so it runs in the Windows app on your laptop (Stock Trader AI). Open it there.</p>`;
  if(PHONE){h+=`<p class="note">New stocks are analysed in the laptop app; they show up here after it syncs, and are re-checked every evening.</p>`;}
  if(!PHONE&&!ANA.loaded) loadAnalyzed();
  if(!PHONE)h+=`<section class="card"><form id="anaF" class="row" style="align-items:flex-end;gap:8px" autocomplete="off">
   <label for="anaQ" style="flex:1;min-width:220px">NSE symbol or company name<input id="anaQ" list="anaList" placeholder="e.g. PNB, TATAPOWER, Punjab National" ${ANA.busy?"disabled":""}></label>
   <datalist id="anaList">${Object.keys(d.snapshot||{}).sort().map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
   <button class="primary" ${ANA.busy?"disabled":""}>${ANA.busy?"Analysing "+esc(ANA.busy)+"…"+(ANA.ready?"":" (about a minute)"):"Analyze"}</button></form>
   <p class="soft" style="margin:8px 0 0">Live prices, company data and news from Yahoo Finance and Google News. Takes 10–30 seconds${ANA.ready?"":"; the first check today takes about a minute while it downloads stocks to compare with"}.</p>
   <div role="status" aria-live="polite">${ANA.err?`<p class="note bad" style="margin:8px 0 0">${esc(ANA.err)}</p>`:""}</div></section>`;
  if(!PHONE&&!ANA.ready) h+=`<p class="soft" style="margin:0 0 10px">Until tonight's 6 PM scan, stocks are compared with about 90 stocks downloaded today instead of the full Nifty 500. <button type="button" id="anaScan" ${ANA.scanning?"disabled":""}>${ANA.scanning?"Full scan running (a few minutes)…":"Run the full scan now"}</button></p>`;
  if(!ANA.items.length) return h+`<section class="card"><p class="soft">No stocks added yet.</p></section>`;
  h+=ANA.items.map(r=>{const inTop=d.top.find(x=>x.symbol===r.symbol);
    const notes=[],minS=d.min_score||80,reasons=[];
    if(!inTop){(r.vetoes||[]).forEach(v=>reasons.push("Fails a hard check: "+v));
      (r.quality_issues||[]).forEach(q=>reasons.push("Misses the quality bar: "+q));
      if(r.score<minS)reasons.push(`Score ${r.score.toFixed(0)} is below ${minS}.`);
      if(/down/i.test(r.state||""))reasons.push("Price trend is down.");
      if(!reasons.length)reasons.push("It passes the checks, but other stocks ranked higher today.");}
    if(inTop) notes.push(`<strong class="pos">#${inTop.rank} in today's top list.</strong>`);
    else if((r.vetoes||[]).length) notes.push(`<strong class="neg">Fails a hard check:</strong> ${esc(r.vetoes.join("; "))}`);
    else if((r.quality_issues||[]).length) notes.push(`<strong class="amb">Not in the top list because it misses the quality bar:</strong> ${esc(r.quality_issues.join("; "))}`);
    else if(r.score<(d.min_score||80)) notes.push(`<span class="amb">Score is below ${d.min_score||80}, so it is not in the top list.</span>`);
    else notes.push(`<span class="soft">Passes the checks but other stocks ranked higher today.</span>`);
    const extra=`<p style="margin:8px 0 0">${notes.join(" ")}</p><div class="row" style="gap:6px;margin-top:8px;align-items:center">
      <span class="soft" style="font-size:13px">Checked ${esc((r.analyzed_at||"").replace("T"," ").slice(0,16))} · prices to ${esc(r.as_of||"")}${r.compare_note?" · "+esc(r.compare_note):""}</span>
      ${PHONE?"":`<button type="button" data-ana-refresh="${esc(r.symbol)}" ${ANA.busy?"disabled":""}>Check again</button><button type="button" data-ana-remove="${esc(r.symbol)}">Remove</button>`}</div>`;
    return stockCard({...r,rank:null},t,{extra,own:true,notListed:inTop?null:reasons});}).join("");
  return h;
},
top20(){
  const d=cur(),v=d.validation||{},t=d.target_pct,age=daysOld(d.as_of),ch=d.changes||{invalid:[],dropped:[],new:[]};

    :`<p class="note">This list is from before the quality filter was added. From the next scan, only large, profitable, low-debt companies will appear.</p>`;
  if(d.previous_as_of){
    h+=`<section class="card"><h2>Changes since ${esc(d.previous_as_of)}</h2>`;
    h+=ch.invalid.length?`<h3 class="neg">No longer valid</h3><ul class="plain">${ch.invalid.map(x=>`<li><strong>${esc(x.symbol)}</strong> (was #${x.prev_rank}): ${esc(x.reason)}${held(B).includes(x.symbol)?" <strong>You hold this stock.</strong>":""}</li>`).join("")}</ul>`:`<p class="pos" style="margin:0 0 6px">No stock from the previous list became invalid.</p>`;
    if(ch.dropped.length) h+=`<h3 style="margin-top:10px">Dropped out, still valid</h3><p class="soft" style="margin:0">${ch.dropped.map(x=>esc(x.symbol)+" (was #"+x.prev_rank+")").join(", ")}</p>`;
    h+=`<p class="soft" style="margin:8px 0 0">New in the list: ${esc(ch.new.join(", ")||"none")}</p></section>`;
  }
  h+=`<p class="note">${g?`<strong>${g} in the buy zone</strong> (every entry check passed).`:"None is in the buy zone today."} ${y?y+" close to it.":""} Read the news under each stock before buying. Confirm every price at your broker.</p>`;
  const card=r=>stockCard(r,t);
  const ALL=d.top.concat(d.quality_misses||[]);const fc=(grp,k,l)=>{const on=FLT[grp].includes(k),n=ALL.filter(r=>(grp==="zone"?zoneKey(r):scoreKey(r))===k).length;
    return `<button type="button" class="fchip${on?" on":""}" aria-pressed="${on}" data-flt="${grp}" data-val="${k}">${on?"✓ ":""}${esc(l)} <span class="cnt">${n}</span></button>`;};
  const shown=ALL.filter(passFlt), fl=list.filter(passFlt), fb=below.filter(passFlt), anyF=FLT.zone.length||FLT.score.length;
  h+=`<section class="card filters" aria-label="Filter the list"><div class="fgroup" role="group" aria-label="Buy zone"><span class="flabel">Buy zone</span>${ZONE_CH.map(([k,l])=>fc("zone",k,l)).join("")}</div>
   <div class="fgroup" role="group" aria-label="Score"><span class="flabel">Score</span>${SCORE_CH.map(([k,l])=>fc("score",k,l)).join("")}</div>
   <div class="row" style="align-items:center;justify-content:space-between;gap:8px;margin-top:6px"><span class="soft" role="status">Showing ${shown.length} of ${ALL.length}${anyF?" · pick several in a row to combine them":""}</span>
   ${anyF?'<button type="button" data-flt="clear">Clear filters</button>':""}</div>
   <div class="row" style="gap:6px;margin-top:8px"><button type="button" data-dl="csv">⬇ Download table (Excel CSV)</button>${anyF?'<button type="button" data-dl="csvf">⬇ Download filtered rows</button>':""}
   ${LOCAL?'<button type="button" data-wa-open="1">📲 Send to my WhatsApp</button><a class="btn" href="/download/report.html" download>⬇ Full report (HTML)</a><a class="btn" href="/download/performance.csv" download>⬇ Performance (CSV)</a>':""}</div></section>`;
  h+=LOCAL?waChooser():"";
  h+=fl.length?fl.map(card).join(""):`<section class="card"><p>${list.length?"No stock matches these filters.":`No stock scores ${minS} or more today. Holding cash is a valid choice.`}</p></section>`;
  if(fb.length) h+=`<details class="card" ${FLT.score.includes("lt80")?"open":""}><summary>${fb.length} more from this list score below ${minS}</summary>${fb.map(card).join("")}</details>`;
  const qm=(d.quality_misses||[]).filter(passFlt);
  if(qm.length) h+=`<section><h2 style="margin-top:18px">Also scoring ${minS}+, but missing the quality bar (${qm.length})</h2><p class="soft" style="margin:0 0 8px">These pass the price and momentum checks but fail one company-strength check (size, debt, return on equity or cash flow). The reason is on each card. They carry more risk than the list above.</p></section>`+qm.map(card).join("");
  else if((d.quality_misses||[]).length===0&&d.quality_on&&!("quality_misses" in d)) h+=`<p class="note">Stocks that score ${minS}+ but miss the quality bar will appear here from the next scan.</p>`;

  if(still.length){const pc2=v=>v==null?"–":`<span class="${v>0?"pos":v<0?"neg":""}">${v>0?"+":""}${Number(v).toFixed(2)}%</span>`;

  h+=stepSection(d);
  if(v.test_dates) h+=`<section class="card"><h2>How the list behaved over the past year</h2><p class="soft">The same ranking applied on ${v.test_dates} past dates (${esc(v.from)} to ${esc(v.to)}), using only data available on each date.</p>
  <div class="scroll"><table><tbody>
  <tr><td>Picks that touched +${t}% within 5 sessions</td><td class="r">${v.picks_hit_pct}%</td></tr><tr><td>All eligible stocks</td><td class="r">${v.universe_hit_pct}%</td></tr>
  <tr><td>Picks that touched −${t}% (your next part would be bought)</td><td class="r">${v.picks_fell_3pct_pct}%</td></tr>
  <tr><td>Average 5-session change: picks / all stocks</td><td class="r">${v.picks_avg_5d_return_pct}% / ${v.universe_avg_5d_return_pct}%</td></tr></tbody></table></div>
  <p class="soft">${esc(v.note)}</p></section>`;
  const rej=(d.quality_rejected||[]).concat((d.vetoed||[]).map(x=>({symbol:x.symbol,reasons:x.reasons})));
  if(rej.length) h+=`<section class="card"><h2>Left out for quality or fundamental reasons</h2><ul class="plain">${rej.map(x=>`<li>${esc(x.symbol)}${x.score?` (score ${x.score.toFixed(0)})`:""}: ${esc(x.reasons.join("; "))}</li>`).join("")}</ul></section>`;
  return h;
},
perf(){
  const bt=picksSection()+btSection()+cmpSection();
  const d=cur(),days=Object.keys(d.perf_days||{}).sort().reverse(),weeks=Object.keys(d.perf_weeks||{}).sort().reverse();
  if(!days.length) return bt+`<section class="card"><h2>Performance</h2><p>Daily and weekly tables start with the next scan (weekdays at 6 PM). From then on every listed stock is followed until it becomes invalid.</p></section>`;
  const view=PERF.view, near=PERF.near;
  const chip=(k,v,l)=>`<button type="button" class="${PERF[k]===v?"primary":""}" data-perf="${k}" data-val="${esc(String(v))}">${esc(l)}</button>`;
  let h=bt+`<section><h2>How the listed stocks performed</h2><div class="row" style="gap:6px;margin-bottom:8px">${chip("view","day","Daily")}${chip("view","week","Weekly")}
    <button type="button" class="${near?"primary":""}" data-perf="near" data-val="${near?"":"1"}">${near?"✓ ":""}Near entry zone only</button></div>`;
  const keep=r=>!near||["GREEN","YELLOW"].includes(r.added_colour);
  const pc2=v=>v==null?"–":`<span class="${v>0?"pos":v<0?"neg":""}">${v>0?"+":""}${Number(v).toFixed(2)}%</span>`;
  const read=c=>c==="GREEN"?'<span class="pos">In zone</span>':c==="YELLOW"?'<span class="amb">Near zone</span>':'<span class="soft">Not in zone</span>';
  if(view==="day"){
    const day=PERF.day&&d.perf_days[PERF.day]?PERF.day:days[0],rows=(d.perf_days[day]||[]).filter(keep);

    <section class="card"><h2>Close of ${esc(day)}</h2><div class="scroll"><table><thead><tr><th>Stock</th><th>Listed</th><th>Reading when listed</th><th class="r">Listed at</th><th class="r">Close</th><th class="r">Day</th><th class="r">Since listed</th><th class="r">Best</th><th class="r">Worst</th><th>+${d.target_pct}% hit</th><th>Status</th></tr></thead><tbody>
    ${rows.sort((a,b)=>(b.since_pct??-99)-(a.since_pct??-99)).map(r=>`<tr><td><strong>${esc(r.symbol)}</strong>${r.rank_today?` <span class="soft">#${r.rank_today}</span>`:""}</td><td>${esc(r.added)}</td><td>${read(r.added_colour)}</td><td class="r">${r.added_close!=null?Number(r.added_close).toFixed(2):"–"}</td><td class="r">${r.close!=null?Number(r.close).toFixed(2):"–"}</td><td class="r">${pc2(r.day_pct)}</td><td class="r">${pc2(r.since_pct)}</td><td class="r">${pc2(r.best_pct)}</td><td class="r">${pc2(r.worst_pct)}</td><td>${r.hit_date?'<span class="pos">'+esc(r.hit_date)+"</span>":"–"}</td><td>${r.status==="invalid"?'<span class="neg">Invalid</span>':r.warning?'<span class="amb">Warning</span>':'<span class="pos">Valid</span>'}</td></tr>`).join("")}</tbody></table></div>
    <p class="soft" style="margin:8px 0 0">"Since listed" compares with the close on the day the stock first appeared. Best and worst use the day's highs and lows after listing. "#n" is its rank in today's top list.</p></section>`;
  } else {
    const wk=PERF.week&&d.perf_weeks[PERF.week]?PERF.week:weeks[0],W=d.perf_weeks[wk],rows=(W.rows||[]).filter(keep);
    const up=rows.filter(r=>r.touched_up).length,dn=rows.filter(r=>r.touched_down).length,avg=rows.length?rows.reduce((a,r)=>a+(r.week_pct||0),0)/rows.length:0;

    <div class="tiles">${tile("Stocks followed",rows.length)}${tile(`Touched +${d.target_pct}% this week`,`${up} (${rows.length?Math.round(100*up/rows.length):0}%)`,"g")}${tile(`Touched −${d.target_pct}%`,`${dn}`,"r")}${tile("Average change",pc2(r2(avg)),avg>=0?"g":"r")}</div>
    <section class="card"><h2>Week of ${esc(W.from)} (to ${esc(W.to)})</h2><div class="scroll"><table><thead><tr><th>Stock</th><th>Reading when listed</th><th class="r">From</th><th class="r">Close</th><th class="r">Week</th><th class="r">Week high</th><th class="r">Week low</th><th>+${d.target_pct}%</th><th>−${d.target_pct}%</th><th>Status</th></tr></thead><tbody>
    ${rows.sort((a,b)=>(b.week_pct??-99)-(a.week_pct??-99)).map(r=>`<tr><td><strong>${esc(r.symbol)}</strong></td><td>${read(r.added_colour)}</td><td class="r">${Number(r.ref).toFixed(2)} <span class="soft">${esc(r.ref_from)}</span></td><td class="r">${Number(r.close).toFixed(2)}</td><td class="r">${pc2(r.week_pct)}</td><td class="r">${pc2(r.high_pct)}</td><td class="r">${pc2(r.low_pct)}</td><td>${r.touched_up?'<span class="pos">Yes</span>':"No"}</td><td>${r.touched_down?'<span class="neg">Yes</span>':"No"}</td><td>${r.status==="invalid"?'<span class="neg" title="'+esc(r.reason||"")+'">Invalid</span>':'<span class="pos">Valid</span>'}</td></tr>`).join("")}</tbody></table></div>
    <p class="soft" style="margin:8px 0 0">Each stock is measured from last week's close, or from its listing close if it was listed this week. The current week fills in each evening.</p></section>`;
  }
  return h;
},
invalid(){
  const d=cur(),L=d.invalid_list||[];

  const pc2=v=>v==null?"–":`<span class="${v>0?"pos":v<0?"neg":""}">${v>0?"+":""}${Number(v).toFixed(2)}%</span>`;
  const hit=L.filter(x=>x.hit_date).length;

const yday=()=>{const d=new Date(today());d.setDate(d.getDate()-1);if(d.getDay()===0)d.setDate(d.getDate()-2);if(d.getDay()===6)d.setDate(d.getDate()-1);return d.toISOString().slice(0,10);};
function knownSyms(){const d=cur();return [...new Set([...held(B),...d.top.map(r=>r.symbol),...Object.keys(d.snapshot||{})])];}
function lastPrice(sym){if(B.prices[sym])return B.prices[sym].p;const q=QUOTES&&QUOTES.prices&&QUOTES.prices[sym];if(q)return q[0];
  const d=cur(),r=d.top.find(x=>x.symbol===sym);if(r)return r.close;const sn=d.snapshot&&d.snapshot[sym];return sn?sn.c:null;}
function findSym(text){const up=" "+text.toUpperCase().replace(/[^A-Z0-9&\- ]/g," ")+" ",ks=knownSyms();
  for(const k of ks.sort((a,b)=>b.length-a.length)) if(up.includes(" "+k+" ")) return k;
  const low=text.toLowerCase(),d=cur();
  for(const r of d.top){const n=(r.name||"").toLowerCase().split(" ")[0];if(n.length>3&&low.includes(n))return r.symbol;}
  const m=text.match(/\b([A-Z][A-Z0-9&\-]{1,14})\b/);return m&&!/^(I|BUY|BOUGHT|SOLD|SELL|AT|QTY|LOT|RS|NSE|TODAY)$/.test(m[1])?m[1]:null;}
function parseNums(text){const t=text.replace(/,/g,"");const out={};
  let m=t.match(/(?:@|\bat\b|price|rs\.?|₹)\s*([0-9]+(?:\.[0-9]+)?)/i);if(m)out.price=parseFloat(m[1]);
  m=t.match(/([0-9]+)\s*(?:qty|shares?|nos|quantity|units?)\b/i)||t.match(/(?:qty|quantity)\s*([0-9]+)/i);if(m)out.qty=parseInt(m[1],10);

    [{label:"Yes, record it",go:true,act:()=>doBuy()},{label:"Change price",act:()=>{d.price=null;nextBuyStep();}},{label:"Change quantity",act:()=>{d.qty=null;nextBuyStep();}},{label:"Cancel",act:cancel}]);}

function invalidKind(why){return /Fundamental red flag/i.test(why)?"company":/Failed screening/i.test(why)?"screen":/Price structure/i.test(why)?"chart":/invalidation level/i.test(why)?"level":/No price/i.test(why)?"data":"other";}
function whyInvalid(sym){reset();const hs=held(B);

      [...(bad.length?bad:hs).slice(0,6).map(x=>({label:"Why "+x+"?",act:()=>whyInvalid(x)})),{label:"Back",act:()=>say("What next?")}]);}
  const d=cur(),inv=invalidity(sym),r=d.top.concat(d.quality_misses||[]).find(x=>x.symbol===sym),sn=(d.snapshot||{})[sym],ls=lotsOf(B,sym),t=B.settings.targetPct;

    if(r)m+=` It scores ${r.score.toFixed(0)}/100 and reads <em>${esc((READ[r.colour]||READ.GREY)[1])}</em>.`;else if(sn)m+=` It is not in today's 80+ list, but no red flag was found.`;

    return say(m,[{label:"📰 "+sym+" news",act:()=>newsFor(sym)},{label:"When can I sell?",act:()=>whenSell(sym)}]);}
  const k=invalidKind(inv.why),plain={company:"the company itself showed a warning sign in its financial data (for example falling profit, high debt or negative cash flow). This is the most serious kind.",
    screen:"it no longer passes one of the tool's basic checks (for example trading volume, price level or listing age).",
    chart:"its price chart has turned weak (the trend changed to down or sideways with selling). It is a timing warning, not a company problem.",
    level:"it closed below the level where the original buy idea stops working.",
    data:"Yahoo Finance did not return a price for it on that scan. This is usually a data gap, not a problem with the stock. Check the price at your broker; if it trades normally, ignore this.",
    other:"it failed one of the tool's checks."}[k];
  let m=`<strong>Why ${esc(sym)} is invalid:</strong> ${esc(inv.why)}.<br>In plain words: ${plain}`;
  if(!ls.length){m+=`<br><br>You don't hold it, so the simple answer is: don't start a new position while it's invalid.`;
    return say(m,[{label:"📰 "+sym+" news",act:()=>newsFor(sym)},{label:"Back",act:()=>say("What next?")}]);}
  const px=lastPrice(sym)||ls[0].buyPrice,rows=ls.map(l=>{const pct=100*(px/l.buyPrice-1);return{l,pct,tgt:l.target||l.buyPrice*(1+t/100)};});

  if(inP.length)m+=`<li>Lot${inP.length>1?"s":""} ${inP.map(x=>x.l.lotNo).join(", ")} ${inP.length>1?"are":"is"} in profit but below +${t}%. ${k==="company"?"With a company warning, many traders take the small profit rather than wait. Your rule allows it, since it isn't a loss (after charges).":k==="data"?"Nothing to do: likely just a data gap.":"A chart or timing warning usually means waiting for +"+t+"% may take longer. Holding is within your rules; taking the small profit is also allowed."}</li>`;
  if(inL.length)m+=`<li>Lot${inL.length>1?"s":""} ${inL.map(x=>x.l.lotNo).join(", ")} ${inL.length>1?"are":"is"} below your buy price. Your rule is <strong>never sell at a loss</strong>, so the rule says hold. ${k==="company"?"Be aware: a company warning is the case where holding carries the most risk of a long wait. Read the news first.":k==="data"?"Likely just a data gap.":"A chart warning alone is usually a timing issue; the replays showed most such lots recover, but some took months."}</li>`;
  m+=`</ul><span class="soft">This applies your own rules to the latest scan. It is not financial advice; the decision is yours.</span>`;
  say(m,[{label:"📰 "+sym+" news",act:()=>newsFor(sym)},{label:"When can I sell?",act:()=>whenSell(sym)},{label:"Other invalid stocks",act:()=>whyInvalid()}]);}
function handle(text){
  const t=text.trim();if(!t)return;me(t);const low=t.toLowerCase(),n=parseNums(t),sym=findSym(t),d=CH.data;
  if(/^(cancel|stop|no)$/i.test(t))return cancel();
  if(/^undo/i.test(t))return undo();
  if(CH.state==="buy"||CH.state==="sell"){
    const num=parseFloat(t.replace(/[₹,rs\s]/gi,""));
    if(!d.sym&&!(isNaN(num)===false&&/^[₹rs\s]*[0-9.,]+$/i.test(t))){
      const known=sym&&(knownSyms().includes(sym)||held(B).includes(sym));
      if(known)d.sym=sym;
      else return pickSymbol(t,x=>{d.sym=x;CH.state==="buy"?nextBuyStep():nextSellStep();});}
    else if(!d.sym&&sym)d.sym=sym;
    else if(d.price==null&&(n.price!=null||(!isNaN(num)&&/^[₹rs\s]*[0-9.,]+$/i.test(t))))d.price=n.price!=null?n.price:num;
    else if(CH.state==="buy"&&d.qty==null&&(n.qty!=null||/^[0-9]+$/.test(t)))d.qty=n.qty!=null?n.qty:parseInt(t,10);
    else if(n.lot)d.lot=n.lot;
    else{if(n.price!=null)d.price=n.price;if(n.qty!=null)d.qty=n.qty;}
    return CH.state==="buy"?nextBuyStep():nextSellStep();}
  if(CH.state==="news")return newsFor(t);
  if(/invalid|why.*(avoid|red|flag)|ok to hold|okay to hold|should i (hold|exit|sell)|exit it|hold or (exit|sell)/.test(low))return whyInvalid(sym&&sym!=="OK"?sym:null);
  if(/\bnews\b|headline/.test(low)){const q=t.replace(/\b(latest|recent|today'?s?|news|headlines?|about|of|for|on|the|show|me|get|give|any|stock|share|what'?s|is|there)\b/gi," ").replace(/[?!.]/g," ").trim();return q?newsFor(sym||q):askNews();}
  if(/^(hi|hello|hey|help|hai)\b/i.test(t))return say("I can record your buys and sales, answer about your open stocks, sell targets and next buy levels, and fetch the latest news of any stock with a good/bad verdict. Type a stock, e.g. <em>PNB</em>, or tap a button.");
  if(/next (buy|entry|level)|buy levels?|averag|add more/.test(low))return nextBuys();
  if(/\b(bought|buy|purchased|added|entered)\b/.test(low))return startBuy({sym:sym||undefined,price:n.price,qty:n.qty,date:n.date||today(),dateAsked:!!n.date});
  if(/\b(sold|sell order executed|exited|booked)\b/.test(low))return startSell({sym:sym||undefined,price:n.price,lot:n.lot});
  if(/when.*sell|target|exit|book profit/.test(low))return whenSell(sym&&held(B).includes(sym)?sym:null);
  if(/next (buy|entry|level)|average|averag|add more/.test(low))return nextBuys();
  if(/open|holding|position|portfolio|my stocks|p&l|profit|loss/.test(low))return showOpen();
  if(/top|pick|suggest|which stock|buy zone/.test(low))return topPicks();
  if(/price/.test(low)&&sym&&n.price!=null){setPrice(B,sym,n.price,today()+"T"+new Date().toTimeString().slice(0,5));B.prices[sym].src="entered";persist();render();return say(`${esc(sym)} price set to ₹${fmt(n.price)}.`);}
  if(/^[a-z0-9&.\- ]{2,40}$/i.test(t)&&/[a-z]/i.test(t)&&t.split(/\s+/).length<=4)return newsFor(sym||t);      // just a stock name: show its news
  say("I can record buys and sales, answer about your open stocks, sell targets, next buy levels and today's picks, and fetch any stock's news. Try: <em>bought MRPL 300 at 178.5</em> or <em>PNB news</em>.");}

function openChat(){const c=$("#chat");c.hidden=false;$("#fab").setAttribute("aria-expanded","true");
  if(!CH.opened){CH.opened=true;say(`Hi, I'm <strong>Sto-Bot</strong>! Tell me what you traded, e.g. <em>bought MRPL 300 at 178.5</em>, or type any stock, e.g. <em>PNB</em>, for its latest news and whether it is good or bad for the price. I update your positions straight away${cloudRef?" and save them to your Claude account":""}.`);}
  $("#chatIn").focus();}
function closeChat(){$("#chat").hidden=true;$("#fab").setAttribute("aria-expanded","false");$("#fab").focus();}
$("#fab").addEventListener("click",()=>$("#chat").hidden?openChat():closeChat());
$("#chatX").addEventListener("click",closeChat);
$("#chat").addEventListener("keydown",e=>{if(e.key==="Escape")closeChat();});
$("#chips").addEventListener("click",e=>{const b=e.target.closest("[data-chip]");if(!b)return;const c=CH.acts[b.dataset.chip];if(!c)return;me(c.label);c.act();});
$("#chatF").addEventListener("submit",e=>{e.preventDefault();const v=$("#chatIn").value;$("#chatIn").value="";handle(v);});
loadLocal();applyScan();render();if(LOCAL)initLocal();else if(PHONE)initPhone();else initCloud();
</script>
